name: Build Frontend and Backend Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - trunk
    paths:
      - "next/**"
      - "go/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches:
      - trunk
    paths:
      - "next/**"
      - "go/**"

jobs:
  detect-and-build:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    env:
      FRONTEND_IMAGE: frontend
      BACKEND_IMAGE: backend
      NEXT_PUBLIC_BASE_URI: http://localhost:8080

    steps:
      - name: Convert image namespace to lowercase
        id: lc
        run: |
          echo "namespace=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine which services changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'next/**'
            backend:
              - 'go/**'
              
      - name: Set Secrets
        run: | # Secrets needed on the server
          echo "NEXT_PUBLIC_BASE_URI=http://localhost:8080" >> ./next/.env.production
          
      - name: Build & Push Frontend image
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./next
          file: ./next/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.lc.outputs.namespace }}/${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_BASE_URI=http://localhost:8080

      - name: Build & Push Backend image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./go
          file: ./go/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.lc.outputs.namespace }}/${{ env.BACKEND_IMAGE }}:latest
