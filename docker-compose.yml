version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  backend:
    build: ./go
    #image: ghcr.io/bekzhankaspakov/backend:latest
    container_name: go-backend
    restart: always
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - PORT=9080
    ports:
      - "9080:9080"
    networks:
      - app-network

  frontend:
    build:
      context: ./next
    #image: ghcr.io/bekzhankaspakov/frontend:latest
    container_name: next-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    ports:
      - "80:3000"
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
