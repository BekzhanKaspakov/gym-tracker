version: "3.8"

services:
  nextjs:
    build:
      context: ./next
    container_name: nextjs-app
    ports:
      - "80:3000" # serve app on port 80
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    restart: always

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./go
    container_name: go-server
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      - mongo

volumes:
  mongo_data:
